openapi: 3.0.3
info:
  title: Claims Management System API
  description: |-
    API specification for the Claims Management System, a Spring Boot application for managing insurance claims.
    
    ## Features
    - Create and manage claimants
    - Submit and track insurance claims
    - Assign claims to staff members
    - Monitor workload and claims status
    
    ## Claim Lifecycle States
    - SUBMITTED: Initial claim submission
    - ASSIGNED: Claim assigned to a staff member
    - ASSESSMENT_IN_PROGRESS: Under review
    - MORE_INFO_REQUESTED: Additional information needed
    - MORE_INFO_PROVIDED: Claimant has provided the requested information
    - APPROVED: Claim approved
    - REJECTED: Claim rejected
    - SETTLEMENT_IN_PROGRESS: Settlement being processed
    - CLOSED: Claim closed
  contact:
    name: API Support
    email: support@chubb.com
  version: 0.0.1-SNAPSHOT
servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://api.claimsmanagement.com
    description: Production server
tags:
  - name: Claimants
    description: Claimant management operations
  - name: Claims
    description: Claims management and lifecycle operations
  - name: Assessments
    description: Assessment and evaluation operations
  - name: Workload
    description: Workload and management operations
  - name: Staff
    description: Staff management and claim queue operations

paths:
  /api/v1/claimants:
    post:
      tags:
        - Claimants
      summary: Create a new claimant
      description: Register a new claimant in the system
      operationId: createClaimant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClaimantRequest'
            examples:
              default:
                value:
                  claimantMemberNumber: "CM-1001"
                  firstName: John
                  lastName: Doe
                  email: john.doe@example.com
                  phone: "+1-555-0100"
                  address: "123 Main St, Sydney, NSW"
                  policyNumber: "POL-1001"
      responses:
        '201':
          description: Claimant created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseClaimant'
              examples:
                default:
                  value:
                    success: true
                    data:
                      id: 11111111-1111-1111-1111-111111111111
                      claimantMemberNumber: "CM-1001"
                      firstName: John
                      lastName: Doe
                      email: john.doe@example.com
                      phone: "+1-555-0100"
                      address: "123 Main St, Sydney, NSW"
                      policyNumber: "POL-1001"
                    message: Claimant created successfully
                    timestamp: "2024-01-15T10:30:00.000Z"
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
        '409':
          description: Claimant already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'

  /api/v1/claimants/{id}:
    get:
      tags:
        - Claimants
      summary: Get claimant by ID
      description: Retrieve a specific claimant's information
      operationId: getClaimant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Claimant ID
          example: 11111111-1111-1111-1111-111111111111
      responses:
        '200':
          description: Claimant found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseClaimant'
              examples:
                default:
                  value:
                    success: true
                    data:
                      id: 11111111-1111-1111-1111-111111111111
                      claimantMemberNumber: CM-1001
                      firstName: John
                      lastName: Doe
                      email: john.doe@example.com
                      phone: "+1-555-0100"
                      address: "123 Main St, Sydney, NSW"
                      policyNumber: POL-1001
                    message: OK
                    timestamp: "2024-01-15T10:30:00.000Z"
        '404':
          description: Claimant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'

  /api/v1/claims:
    post:
      tags:
        - Claims
      summary: Create a new claim
      description: Submit a new insurance claim for a claimant
      operationId: createClaim
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClaimRequest'
            examples:
              motor:
                value:
                  claimantMemberNumber: "CM-1001"
                  claimType: MOTOR
                  description: Car accident on Main Street involving two vehicles
              property:
                value:
                  claimantMemberNumber: "CM-1002"
                  claimType: PROPERTY
                  description: Water damage to kitchen from burst pipe
      responses:
        '201':
          description: Claim created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseClaimResponse'
              examples:
                default:
                  value:
                    success: true
                    data:
                      claimNumber: "CLM-ABC12345"
                      claimantMemberNumber: "CM-1001"
                      claimType: MOTOR
                      status: SUBMITTED
                      description: Car accident on Main Street involving two vehicles
                      createdAt: "2024-01-15T10:30:00"
                      updatedAt: "2024-01-15T10:30:00"
                    message: Claim created successfully
                    timestamp: "2024-01-15T10:30:00.000Z"
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
        '404':
          description: Claimant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'

    get:
      tags:
        - Claims
      summary: Get claims by claimant
      description: Retrieve all claims for a specific claimant by internal ID or member number
      operationId: getClaimsByClaimant
      parameters:
        - name: claimantId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Internal claimant ID to filter claims
          example: 11111111-1111-1111-1111-111111111111
        - name: claimantMemberNumber
          in: query
          required: false
          schema:
            type: string
          description: Claimant member number to filter claims
          example: CM-1001
      responses:
        '200':
          description: List of claims retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseClaimResponseList'
              examples:
                default:
                  value:
                    success: true
                    data:
                      - claimNumber: "CLM-ABC12345"
                        claimantMemberNumber: "CM-1001"
                        claimType: MOTOR
                        status: APPROVED
                        description: Car accident on Main Street
                        createdAt: "2024-01-15T10:30:00"
                        updatedAt: "2024-01-15T12:15:00"
                    message: OK
                    timestamp: "2024-01-15T10:30:00.000Z"
        '400':
          description: Missing required parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'

  /api/v1/claims/{claimNumber}:
    get:
      tags:
        - Claims
      summary: Get claim by claim number
      description: Retrieve a specific claim's details using the generated claim number
      operationId: getClaim
      parameters:
        - name: claimNumber
          in: path
          required: true
          schema:
            type: string
          description: Customer-facing claim number
          example: CLM-ABC12345
      responses:
        '200':
          description: Claim found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseClaimResponse'
              examples:
                default:
                  value:
                    success: true
                    data:
                      claimNumber: "CLM-ABC12345"
                      claimantMemberNumber: "CM-1001"
                      claimType: MOTOR
                      status: SUBMITTED
                      description: Car accident on Main Street involving two vehicles
                      createdAt: "2024-01-15T10:30:00"
                      updatedAt: "2024-01-15T10:30:00"
                    message: OK
                    timestamp: "2024-01-15T10:30:00.000Z"
        '404':
          description: Claim not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'

  /api/v1/claims/{claimNumber}/more-information:
    put:
      tags:
        - Claims
      summary: Provide additional claim information
      description: Allow a claimant to provide updated information after staff requested more information
      operationId: updateClaimInformation
      parameters:
        - name: claimNumber
          in: path
          required: true
          schema:
            type: string
          description: Public claim number awaiting additional information
          example: CLM-ABC12345
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClaimInformationRequest'
            examples:
              default:
                value:
                  description: Police report and repair estimate attached for the accident on Main Street.
      responses:
        '200':
          description: Claim information updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseClaimResponse'
              examples:
                default:
                  value:
                    success: true
                    data:
                      claimNumber: "CLM-ABC12345"
                      claimantMemberNumber: "CM-1001"
                      claimType: MOTOR
                      status: MORE_INFO_PROVIDED
                      description: Police report and repair estimate attached for the accident on Main Street.
                      createdAt: "2024-01-15T10:30:00"
                      updatedAt: "2024-01-15T13:00:00"
                    message: Claim information updated successfully
                    timestamp: "2024-01-15T13:00:00.000Z"
        '400':
          description: Claim is not awaiting additional information or the request is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
        '404':
          description: Claim not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'

  /api/v1/claims/{claimNumber}/assign:
    post:
      tags:
        - Claims
      summary: Assign claim to staff member
      description: Assign a claim to a staff member for processing
      operationId: assignClaim
      parameters:
        - name: claimNumber
          in: path
          required: true
          schema:
            type: string
          description: Public claim number to assign
          example: CLM-ABC12345
        - name: staffNumber
          in: query
          required: true
          schema:
            type: string
          description: Public staff number to assign the claim to
          example: STAFF-1001
      responses:
        '200':
          description: Claim assigned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseClaimResponse'
              examples:
                default:
                  value:
                    success: true
                    data:
                      claimNumber: "CLM-ABC12345"
                      claimantMemberNumber: "CM-1001"
                      claimType: MOTOR
                      status: ASSIGNED
                      description: Car accident on Main Street involving two vehicles
                      createdAt: "2024-01-15T10:30:00"
                      updatedAt: "2024-01-15T11:00:00"
                    message: Claim assigned successfully
                    timestamp: "2024-01-15T11:00:00.000Z"
        '400':
          description: Invalid state or request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
        '404':
          description: Claim or staff member not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'

  /api/v1/claims/{claimNumber}/assessments/start:
    post:
      tags:
        - Assessments
      summary: Start an assessment
      description: Mark an assigned claim as being assessed by a staff member
      operationId: startAssessment
      parameters:
        - name: claimNumber
          in: path
          required: true
          schema:
            type: string
          description: Public claim number to start assessing
          example: CLM-ABC12345
        - name: staffNumber
          in: query
          required: true
          schema:
            type: string
          description: Public staff number starting the assessment
          example: STAFF-1001
      responses:
        '200':
          description: Assessment started successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseClaimResponse'
              examples:
                default:
                  value:
                    success: true
                    data:
                      claimNumber: "CLM-ABC12345"
                      claimantMemberNumber: "CM-1001"
                      claimType: MOTOR
                      status: ASSESSMENT_IN_PROGRESS
                      description: Car accident on Main Street involving two vehicles
                      createdAt: "2024-01-15T10:30:00"
                      updatedAt: "2024-01-15T11:15:00"
                    message: Assessment started successfully
                    timestamp: "2024-01-15T11:15:00.000Z"
        '400':
          description: Claim is not ready for assessment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
        '404':
          description: Claim or staff member not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'

  /api/v1/claims/{claimNumber}/assessments:
    post:
      tags:
        - Assessments
      summary: Create a new assessment
      description: Create an assessment for a claim to determine approval, rejection, or request for more information
      operationId: createAssessment
      parameters:
        - name: claimNumber
          in: path
          required: true
          schema:
            type: string
          description: Public claim number to assess
          example: CLM-ABC12345
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssessmentRequest'
            examples:
              approved:
                value:
                  claimNumber: CLM-ABC12345
                  staffNumber: STAFF-1001
                  assessmentType: INITIAL_REVIEW
                  description: Initial assessment completed. Claim appears valid and within policy terms.
                  details: All documentation provided. No red flags identified.
                  estimatedAmount: 5000.00
                  result: APPROVED
              moreInfo:
                value:
                  claimNumber: CLM-ABC12345
                  staffNumber: STAFF-1001
                  assessmentType: INITIAL_REVIEW
                  description: Additional information needed for approval.
                  details: Police report missing. Request copy from claimant.
                  estimatedAmount: 5000.00
                  result: MORE_INFO_REQUIRED
      responses:
        '201':
          description: Assessment created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAssessment'
              examples:
                default:
                  value:
                    success: true
                    data:
                      id: 66666666-6666-6666-6666-666666666666
                      claimNumber: "CLM-ABC12345"
                      staffNumber: STAFF-1001
                      assessmentType: INITIAL_REVIEW
                      description: Initial assessment completed
                      details: All documentation provided
                      estimatedAmount: 5000.00
                      settledAmount: null
                      result: APPROVED
                      createdAt: "2024-01-15T11:30:00"
                      updatedAt: "2024-01-15T11:30:00"
                    message: Assessment created successfully
                    timestamp: "2024-01-15T11:30:00.000Z"
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
        '404':
          description: Claim or staff not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
    get:
      tags:
        - Assessments
      summary: Get assessments for a claim
      description: Retrieve all assessments associated with a specific claim
      operationId: getAssessmentsByClaim
      parameters:
        - name: claimNumber
          in: path
          required: true
          schema:
            type: string
          description: Public claim number to retrieve assessments for
          example: CLM-ABC12345
      responses:
        '200':
          description: Assessments retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAssessmentList'
              examples:
                default:
                  value:
                    success: true
                    data:
                      - id: 66666666-6666-6666-6666-666666666666
                        claimNumber: "CLM-ABC12345"
                        staffNumber: STAFF-1001
                        assessmentType: INITIAL_REVIEW
                        description: Initial assessment completed
                        details: All documentation provided
                        estimatedAmount: 5000.00
                        settledAmount: null
                        result: APPROVED
                        createdAt: "2024-01-15T11:30:00"
                        updatedAt: "2024-01-15T11:30:00"
                    message: OK
                    timestamp: "2024-01-15T11:30:00.000Z"
        '404':
          description: Claim not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'

  /api/v1/staff:
    get:
      tags:
        - Staff
      summary: List staff members
      description: Retrieve staff members available to process claims
      operationId: getStaff
      responses:
        '200':
          description: Staff members retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseStaffList'
              examples:
                default:
                  value:
                    success: true
                    data:
                      - staffNumber: STAFF-1001
                        firstName: Alicia
                        lastName: Nguyen
                        email: alicia.nguyen@claims.local
                        phone: "+61-400-000-001"
                        role: CLAIMS_ADJUSTER
                        createdAt: "2024-01-15T10:30:00"
                      - staffNumber: STAFF-1002
                        firstName: Marcus
                        lastName: Lee
                        email: marcus.lee@claims.local
                        phone: "+61-400-000-002"
                        role: TEAM_LEAD
                        createdAt: "2024-01-15T10:30:00"
                    message: OK
                    timestamp: "2024-01-15T10:30:00.000Z"

  /api/v1/staff/{staffNumber}:
    get:
      tags:
        - Staff
      summary: Get a staff member
      description: Retrieve a staff member by ID
      operationId: getStaffMember
      parameters:
        - name: staffNumber
          in: path
          required: true
          schema:
            type: string
          description: Public staff number
      responses:
        '200':
          description: Staff member found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseStaff'
              examples:
                default:
                  value:
                    success: true
                    data:
                      staffNumber: STAFF-1001
                      firstName: Alicia
                      lastName: Nguyen
                      email: alicia.nguyen@claims.local
                      phone: "+61-400-000-001"
                      role: CLAIMS_ADJUSTER
                      createdAt: "2024-01-15T10:30:00"
                    message: OK
                    timestamp: "2024-01-15T10:30:00.000Z"
        '404':
          description: Staff member not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'

  /api/v1/staff/claims/queue:
    get:
      tags:
        - Staff
      summary: Get claims available for pickup
      description: Retrieve submitted claims waiting for a staff member to pick them up, ordered oldest first
      operationId: getAvailableStaffClaims
      responses:
        '200':
          description: Available claims retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseStaffClaimQueueList'
              examples:
                default:
                  value:
                    success: true
                    data:
                      - claimNumber: CLM-QUEUE1001
                        claimantMemberNumber: CM-1002
                        claimType: PROPERTY
                        claimStatus: SUBMITTED
                        queueStatus: AVAILABLE
                        staffNumber: null
                        queuedAt: "2024-01-16T09:00:00"
                        pickedUpAt: null
                    message: OK
                    timestamp: "2024-01-16T09:00:00.000Z"

  /api/v1/staff/{staffNumber}/claims/queue:
    get:
      tags:
        - Staff
      summary: Get claims picked up by staff
      description: Retrieve claims currently picked up by a staff member
      operationId: getStaffClaimQueue
      parameters:
        - name: staffNumber
          in: path
          required: true
          schema:
            type: string
          description: Public staff number
      responses:
        '200':
          description: Staff queue retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseStaffClaimQueueList'
              examples:
                default:
                  value:
                    success: true
                    data:
                      - claimNumber: CLM-QUEUE1001
                        claimantMemberNumber: CM-1002
                        claimType: PROPERTY
                        claimStatus: ASSIGNED
                        queueStatus: PICKED_UP
                        staffNumber: STAFF-1001
                        queuedAt: "2024-01-16T09:00:00"
                        pickedUpAt: "2024-01-16T09:15:00"
                    message: OK
                    timestamp: "2024-01-16T09:15:00.000Z"
        '404':
          description: Staff member not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'

  /api/v1/staff/{staffNumber}/claims/queue/{claimNumber}/pickup:
    post:
      tags:
        - Staff
      summary: Pick up a claim
      description: Atomically assign an available claim to a staff member
      operationId: pickUpClaim
      parameters:
        - name: staffNumber
          in: path
          required: true
          schema:
            type: string
        - name: claimNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Claim picked up successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseStaffClaimQueue'
              examples:
                default:
                  value:
                    success: true
                    data:
                      claimNumber: CLM-QUEUE1001
                      claimantMemberNumber: CM-1002
                      claimType: PROPERTY
                      claimStatus: ASSIGNED
                      queueStatus: PICKED_UP
                      staffNumber: STAFF-1001
                      queuedAt: "2024-01-16T09:00:00"
                      pickedUpAt: "2024-01-16T09:15:00"
                    message: Claim picked up successfully
                    timestamp: "2024-01-16T09:15:00.000Z"
        '400':
          description: Claim cannot be picked up or is owned by another staff member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
        '404':
          description: Staff member or available claim not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'

  /api/v1/staff/{staffNumber}/claims/queue/{claimNumber}/requeue:
    post:
      tags:
        - Staff
      summary: Requeue a picked-up claim
      description: Return a claim to the available queue
      operationId: requeueClaim
      parameters:
        - name: staffNumber
          in: path
          required: true
          schema:
            type: string
        - name: claimNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Claim requeued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseStaffClaimQueue'
              examples:
                default:
                  value:
                    success: true
                    data:
                      claimNumber: CLM-QUEUE1001
                      claimantMemberNumber: CM-1002
                      claimType: PROPERTY
                      claimStatus: SUBMITTED
                      queueStatus: AVAILABLE
                      staffNumber: null
                      queuedAt: "2024-01-16T09:00:00"
                      pickedUpAt: null
                    message: Claim requeued successfully
                    timestamp: "2024-01-16T09:20:00.000Z"
        '400':
          description: Claim is assigned to another staff member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
        '404':
          description: Staff member or picked-up claim not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'

  /api/v1/assessments/{assessmentId}:
    get:
      tags:
        - Assessments
      summary: Get assessment by ID
      description: Retrieve a specific assessment's details
      operationId: getAssessment
      parameters:
        - name: assessmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Assessment ID
          example: 66666666-6666-6666-6666-666666666666
      responses:
        '200':
          description: Assessment found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAssessment'
              examples:
                default:
                  value:
                    success: true
                    data:
                      id: 66666666-6666-6666-6666-666666666666
                      claimNumber: CLM-ABC12345
                      staffNumber: STAFF-1001
                      assessmentType: INITIAL_REVIEW
                      description: Initial assessment completed. Claim is valid and within policy terms.
                      details: All documentation provided. No red flags identified.
                      estimatedAmount: 5000.00
                      settledAmount: 4800.00
                      result: APPROVED
                      createdAt: "2024-01-15T11:30:00"
                      updatedAt: "2024-01-15T12:15:00"
                    message: OK
                    timestamp: "2024-01-15T12:15:00.000Z"
        '404':
          description: Assessment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'

  /api/v1/staff/{staffNumber}/assessments:
    get:
      tags:
        - Assessments
      summary: Get assessments by staff member
      description: Retrieve all assessments performed by a specific staff member
      operationId: getAssessmentsByStaff
      parameters:
        - name: staffNumber
          in: path
          required: true
          schema:
            type: string
          description: Public staff number
          example: STAFF-1001
      responses:
        '200':
          description: Assessments retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAssessmentList'
              examples:
                default:
                  value:
                    success: true
                    data:
                      - id: 66666666-6666-6666-6666-666666666666
                        claimNumber: CLM-ABC12345
                        staffNumber: STAFF-1001
                        assessmentType: INITIAL_REVIEW
                        description: Initial assessment completed. Claim is valid and within policy terms.
                        details: All documentation provided. No red flags identified.
                        estimatedAmount: 5000.00
                        settledAmount: 4800.00
                        result: APPROVED
                        createdAt: "2024-01-15T11:30:00"
                        updatedAt: "2024-01-15T12:15:00"
                    message: OK
                    timestamp: "2024-01-15T12:15:00.000Z"
        '404':
          description: Staff member not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'

  /api/v1/assessments/{assessmentId}/settlement:
    patch:
      tags:
        - Assessments
      summary: Update settled amount
      description: Update the settled amount for an assessment
      operationId: updateSettledAmount
      parameters:
        - name: assessmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Assessment ID
          example: 66666666-6666-6666-6666-666666666666
        - name: settledAmount
          in: query
          required: true
          schema:
            type: number
            format: double
          description: The settled amount for the assessment
          example: 4800.00
      responses:
        '200':
          description: Settled amount updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAssessment'
              examples:
                default:
                  value:
                    success: true
                    data:
                      id: 66666666-6666-6666-6666-666666666666
                      claimNumber: "CLM-ABC12345"
                      staffNumber: STAFF-1001
                      assessmentType: INITIAL_REVIEW
                      description: Initial assessment completed
                      details: All documentation provided
                      estimatedAmount: 5000.00
                      settledAmount: 4800.00
                      result: APPROVED
                      createdAt: "2024-01-15T11:30:00"
                      updatedAt: "2024-01-15T12:15:00"
                    message: Settled amount updated successfully
                    timestamp: "2024-01-15T12:15:00.000Z"
        '404':
          description: Assessment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'

  /api/v1/management/claims:
    get:
      tags:
        - Workload
      summary: Get workload summary
      description: Retrieve claims workload summary grouped by status
      operationId: getWorkloadSummary
      responses:
        '200':
          description: Workload summary retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWorkloadSummary'
              examples:
                default:
                  value:
                    success: true
                    data:
                      statusSummary:
                        - status: SUBMITTED
                          count: 1
                          claimNumbers:
                            - CLM-QUEUE1001
                        - status: ASSIGNED
                          count: 0
                          claimNumbers: []
                        - status: ASSESSMENT_IN_PROGRESS
                          count: 0
                          claimNumbers: []
                        - status: MORE_INFO_REQUESTED
                          count: 0
                          claimNumbers: []
                        - status: MORE_INFO_PROVIDED
                          count: 0
                          claimNumbers: []
                        - status: APPROVED
                          count: 1
                          claimNumbers:
                            - CLM-ABC12345
                        - status: REJECTED
                          count: 0
                          claimNumbers: []
                        - status: SETTLEMENT_IN_PROGRESS
                          count: 0
                          claimNumbers: []
                        - status: CLOSED
                          count: 0
                          claimNumbers: []
                      staffAssignments:
                        - staffNumber: STAFF-1001
                          assignedClaims: []
                        - staffNumber: STAFF-1002
                          assignedClaims: []
                    message: OK
                    timestamp: "2024-01-15T10:30:00.000Z"

  /api/v1/management/liability-exposure:
    get:
      tags:
        - Workload
      summary: Get outstanding liability exposure
      description: Calculate total requested assessment amounts, approved amounts, and the remaining exposure as requested minus approved.
      operationId: getLiabilityExposure
      responses:
        '200':
          description: Liability exposure calculated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseLiabilityExposure'
              examples:
                default:
                  value:
                    success: true
                    data:
                      totalRequestedAmount: 5000.00
                      totalApprovedAmount: 5000.00
                      outstandingLiabilityExposure: 0.00
                    message: OK
                    timestamp: "2024-01-15T12:15:00.000Z"

components:
  schemas:
    CreateClaimantRequest:
      type: object
      required:
        - claimantMemberNumber
        - firstName
        - lastName
        - email
        - phone
        - address
        - policyNumber
      properties:
        claimantMemberNumber:
          type: string
          minLength: 1
          description: Customer-facing claimant member number used for lookups and tracking
          example: CM-1001
        firstName:
          type: string
          minLength: 1
          description: First name of the claimant
          example: John
        lastName:
          type: string
          minLength: 1
          description: Last name of the claimant
          example: Doe
        email:
          type: string
          format: email
          description: Email address of the claimant
          example: john.doe@example.com
        phone:
          type: string
          minLength: 1
          description: Phone number of the claimant
          example: "+1-555-0100"
        address:
          type: string
          minLength: 1
          description: Physical address of the claimant
          example: "123 Main St, Sydney, NSW"
        policyNumber:
          type: string
          minLength: 1
          description: Insurance policy number
          example: "POL-1001"
      description: Request payload for creating a new claimant

    Claimant:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the claimant
          example: 11111111-1111-1111-1111-111111111111
        claimantMemberNumber:
          type: string
          description: Customer-facing claimant member number
          example: CM-1001
        firstName:
          type: string
          description: First name of the claimant
          example: John
        lastName:
          type: string
          description: Last name of the claimant
          example: Doe
        email:
          type: string
          format: email
          description: Email address of the claimant
          example: john.doe@example.com
        phone:
          type: string
          description: Phone number of the claimant
          example: "+1-555-0100"
        address:
          type: string
          description: Physical address of the claimant
          example: "123 Main St, Sydney, NSW"
        policyNumber:
          type: string
          description: Insurance policy number
          example: "POL-1001"
      description: Claimant entity representing an insurance policy holder

    CreateClaimRequest:
      type: object
      required:
        - claimantMemberNumber
        - claimType
        - description
      properties:
        claimantMemberNumber:
          type: string
          description: Claimant member number used to identify the claimant.
          example: CM-1001
        claimType:
          $ref: '#/components/schemas/ClaimType'
        description:
          type: string
          minLength: 1
          description: Detailed description of the claim
          example: "Car accident on Main Street involving two vehicles"
      description: Request payload for creating a new claim

    UpdateClaimInformationRequest:
      type: object
      required:
        - description
      properties:
        description:
          type: string
          minLength: 1
          description: Updated claim information supplied by the claimant
          example: Police report and repair estimate attached for the accident on Main Street.
      description: Request payload used when staff have requested more information

    ClaimResponse:
      type: object
      properties:
        claimNumber:
          type: string
          description: Unique claim number generated by the system
          example: "CLM-ABC12345"
        claimantMemberNumber:
          type: string
          description: Claimant member number used for customer-facing tracking
          example: CM-1001
        claimType:
          $ref: '#/components/schemas/ClaimType'
        status:
          $ref: '#/components/schemas/ClaimStatus'
        description:
          type: string
          description: Description of the claim
          example: "Car accident on Main Street involving two vehicles"
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the claim was created
          example: "2024-01-15T10:30:00"
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the claim was last updated
          example: "2024-01-15T10:30:00"
      description: Response payload containing claim details

    ClaimEntity:
      type: object
      properties:
        claimNumber:
          type: string
          description: Unique claim number generated by the system
          example: "CLM-ABC12345"
        claimantMemberNumber:
          type: string
          description: Claimant member number used for customer-facing tracking
          example: CM-1001
        claimType:
          $ref: '#/components/schemas/ClaimType'
        status:
          $ref: '#/components/schemas/ClaimStatus'
        description:
          type: string
          description: Description of the claim
          example: "Car accident on Main Street involving two vehicles"
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the claim was created
          example: "2024-01-15T10:30:00"
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the claim was last updated
          example: "2024-01-15T10:30:00"
        version:
          type: integer
          format: int64
          description: Version number for optimistic locking
          example: 1
      description: Full Claim entity with all properties

    ClaimType:
      type: string
      enum:
        - MOTOR
        - PROPERTY
      description: |-
        Type of insurance claim
        - MOTOR: Motor vehicle insurance claim
        - PROPERTY: Property damage insurance claim
      example: MOTOR

    ClaimStatus:
      type: string
      enum:
        - SUBMITTED
        - ASSIGNED
        - ASSESSMENT_IN_PROGRESS
        - MORE_INFO_REQUESTED
        - MORE_INFO_PROVIDED
        - APPROVED
        - REJECTED
        - SETTLEMENT_IN_PROGRESS
        - CLOSED
      description: |-
        Current status of the claim in its lifecycle
        - SUBMITTED: Initial claim submission
        - ASSIGNED: Claim assigned to staff member
        - ASSESSMENT_IN_PROGRESS: Under assessment
        - MORE_INFO_REQUESTED: Awaiting additional information
        - MORE_INFO_PROVIDED: Claimant has provided the requested information
        - APPROVED: Claim approved
        - REJECTED: Claim rejected
        - SETTLEMENT_IN_PROGRESS: Settlement being processed
        - CLOSED: Claim closed
      example: SUBMITTED

    WorkloadSummary:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ClaimStatus'
        count:
          type: integer
          format: int64
          description: Number of claims in this status
          example: 15
        claimNumbers:
          type: array
          description: Public claim numbers currently in this status
          items:
            type: string
          example:
            - CLM-QUEUE1001
      description: Workload summary grouped by claim status

    StaffAssignmentSummary:
      type: object
      properties:
        staffNumber:
          type: string
          description: Public staff number
          example: STAFF-1001
        assignedClaims:
          type: array
          description: Claims currently picked up by this staff member, including their statuses
          items:
            $ref: '#/components/schemas/AssignedClaimSummary'
          example:
            - claimNumber: CLM-QUEUE1001
              status: ASSIGNED

    AssignedClaimSummary:
      type: object
      properties:
        claimNumber:
          type: string
          description: Public claim number
          example: CLM-QUEUE1001
        status:
          $ref: '#/components/schemas/ClaimStatus'
          example: ASSIGNED

    WorkloadSummaryResponse:
      type: object
      properties:
        statusSummary:
          type: array
          description: Claim counts grouped by lifecycle status
          items:
            $ref: '#/components/schemas/WorkloadSummary'
        staffAssignments:
          type: array
          description: Staff members and their currently assigned claim numbers
          items:
            $ref: '#/components/schemas/StaffAssignmentSummary'

    LiabilityExposure:
      type: object
      properties:
        totalRequestedAmount:
          type: number
          format: double
          description: Sum of estimated amounts across all assessments
          example: 5000.00
        totalApprovedAmount:
          type: number
          format: double
          description: Sum of estimated amounts for approved assessments
          example: 5000.00
        outstandingLiabilityExposure:
          type: number
          format: double
          description: Total requested amount minus total approved amount
          example: 0.00

    Staff:
      type: object
      properties:
        staffNumber:
          type: string
          description: Public staff number
          example: STAFF-1001
        firstName:
          type: string
          example: Alicia
        lastName:
          type: string
          example: Nguyen
        email:
          type: string
          format: email
          example: alicia.nguyen@claims.local
        phone:
          type: string
          example: "+61-400-000-001"
        role:
          type: string
          example: CLAIMS_ADJUSTER
        createdAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00"
      description: Staff member who can process claims

    StaffClaimQueue:
      type: object
      properties:
        claimNumber:
          type: string
          description: Public claim number
          example: CLM-ABC12345
        claimantMemberNumber:
          type: string
          example: CM-1002
        claimType:
          $ref: '#/components/schemas/ClaimType'
        claimStatus:
          $ref: '#/components/schemas/ClaimStatus'
        queueStatus:
          type: string
          enum:
            - AVAILABLE
            - PICKED_UP
        staffNumber:
          type: string
          description: Public staff number of the current owner
          example: STAFF-1001
          nullable: true
        queuedAt:
          type: string
          format: date-time
          example: "2024-01-16T09:00:00"
        pickedUpAt:
          type: string
          format: date-time
          nullable: true
          example: "2024-01-16T09:15:00"
      description: A claim waiting for or currently assigned to a staff member

    ApiResponseStaff:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/Staff'
        message:
          type: string
        timestamp:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00.000Z"

    ApiResponseStaffList:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Staff'
        message:
          type: string
        timestamp:
          type: string
          format: date-time

    ApiResponseStaffClaimQueue:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/StaffClaimQueue'
        message:
          type: string
        timestamp:
          type: string
          format: date-time

    ApiResponseStaffClaimQueueList:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/StaffClaimQueue'
        message:
          type: string
        timestamp:
          type: string
          format: date-time

    ApiResponseClaimant:
      type: object
      properties:
        success:
          type: boolean
          description: Indicates if the operation was successful
          example: true
        data:
          $ref: '#/components/schemas/Claimant'
        message:
          type: string
          description: Response message
          example: "Claimant created successfully"
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the response
          example: "2024-01-15T10:30:00.000Z"
      description: API response wrapper for Claimant data

    ApiResponseClaimResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Indicates if the operation was successful
          example: true
        data:
          $ref: '#/components/schemas/ClaimResponse'
        message:
          type: string
          description: Response message
          example: "Claim created successfully"
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the response
          example: "2024-01-15T10:30:00.000Z"
      description: API response wrapper for ClaimResponse data

    ApiResponseClaimEntity:
      type: object
      properties:
        success:
          type: boolean
          description: Indicates if the operation was successful
          example: true
        data:
          $ref: '#/components/schemas/ClaimEntity'
        message:
          type: string
          description: Response message
          example: "Claim assigned successfully"
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the response
          example: "2024-01-15T11:00:00.000Z"
      description: API response wrapper for Claim entity data

    ApiResponseClaimResponseList:
      type: object
      properties:
        success:
          type: boolean
          description: Indicates if the operation was successful
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/ClaimResponse'
          description: List of claims
        message:
          type: string
          description: Response message
          example: "OK"
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the response
          example: "2024-01-15T10:30:00.000Z"
      description: API response wrapper for list of ClaimResponse data

    ApiResponseWorkloadSummaryList:
      type: object
      properties:
        success:
          type: boolean
          description: Indicates if the operation was successful
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/WorkloadSummary'
          description: List of workload summaries by claim status
        message:
          type: string
          description: Response message
          example: "OK"
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the response
          example: "2024-01-15T10:30:00.000Z"
      description: API response wrapper for WorkloadSummary list

    ApiResponseWorkloadSummary:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/WorkloadSummaryResponse'
        message:
          type: string
          example: OK
        timestamp:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00.000Z"

    ApiResponseLiabilityExposure:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/LiabilityExposure'
        message:
          type: string
          example: OK
        timestamp:
          type: string
          format: date-time

    CreateAssessmentRequest:
      type: object
      required:
        - claimNumber
        - staffNumber
        - assessmentType
        - description
        - estimatedAmount
        - result
      properties:
        claimNumber:
          type: string
          description: Public claim number being assessed
          example: CLM-ABC12345
        staffNumber:
          type: string
          description: Public staff number of the assessor
          example: STAFF-1001
        assessmentType:
          type: string
          minLength: 1
          description: Type of assessment being performed
          example: INITIAL_REVIEW
        description:
          type: string
          minLength: 1
          description: Description of the assessment findings
          example: "Initial assessment completed. Claim is valid and within policy terms."
        details:
          type: string
          description: Additional detailed notes on the assessment
          example: "All documentation provided. No red flags identified."
        estimatedAmount:
          type: number
          format: double
          description: Estimated settlement amount
          example: 5000.00
        result:
          $ref: '#/components/schemas/AssessmentResult'
      description: Request payload for creating a new assessment

    AssessmentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the assessment
          example: 66666666-6666-6666-6666-666666666666
        claimNumber:
          type: string
          description: Claim number associated with this assessment
          example: "CLM-ABC12345"
        staffNumber:
          type: string
          description: Public staff number of the assessor
          example: STAFF-1001
        assessmentType:
          type: string
          description: Type of assessment
          example: INITIAL_REVIEW
        description:
          type: string
          description: Description of the assessment findings
          example: "Initial assessment completed. Claim is valid and within policy terms."
        details:
          type: string
          description: Detailed notes on the assessment
          example: "All documentation provided. No red flags identified."
        estimatedAmount:
          type: number
          format: double
          description: Estimated settlement amount
          example: 5000.00
        settledAmount:
          type: number
          format: double
          nullable: true
          description: Actual settled amount
          example: 4800.00
        result:
          $ref: '#/components/schemas/AssessmentResult'
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the assessment was created
          example: "2024-01-15T11:30:00"
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the assessment was last updated
          example: "2024-01-15T11:30:00"
      description: Response payload containing assessment details

    AssessmentResult:
      type: string
      enum:
        - APPROVED
        - REJECTED
        - MORE_INFO_REQUIRED
      description: |-
        Result of the assessment
        - APPROVED: Claim approved for settlement
        - REJECTED: Claim rejected
        - MORE_INFO_REQUIRED: Additional information needed from claimant
      example: APPROVED

    ApiResponseAssessment:
      type: object
      properties:
        success:
          type: boolean
          description: Indicates if the operation was successful
          example: true
        data:
          $ref: '#/components/schemas/AssessmentResponse'
        message:
          type: string
          description: Response message
          example: "Assessment created successfully"
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the response
          example: "2024-01-15T11:30:00.000Z"
      description: API response wrapper for Assessment data

    ApiResponseAssessmentList:
      type: object
      properties:
        success:
          type: boolean
          description: Indicates if the operation was successful
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentResponse'
          description: List of assessments
        message:
          type: string
          description: Response message
          example: "OK"
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the response
          example: "2024-01-15T11:30:00.000Z"
      description: API response wrapper for list of Assessment data

    ApiResponseError:
      type: object
      properties:
        success:
          type: boolean
          description: Indicates if the operation was successful
          example: false
        data:
          type: 'null'
          description: No data in error response
        message:
          type: string
          description: Error message
          example: "Resource not found"
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the response
          example: "2024-01-15T10:30:00.000Z"
      description: API response wrapper for error responses

  responses:
    BadRequest:
      description: Bad request - invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponseError'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponseError'

    Conflict:
      description: Conflict - resource already exists or state is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponseError'

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponseError'
