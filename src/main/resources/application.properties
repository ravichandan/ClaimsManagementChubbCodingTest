spring.application.name=claimsmanagement
server.port=8080

# Datasource
spring.datasource.url=jdbc:h2:mem:claimsdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA - Hibernate validates schema created by Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Flyway - handles schema creation and data seeding
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Disable data.sql since Flyway is handling it
spring.sql.init.mode=never

# Actuator & API Documentation
management.endpoints.web.exposure.include=health,info,metrics,openapi,swagger-ui
management.endpoint.health.show-details=always

# Swagger/OpenAPI UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.use-root-path=true

# Embedded ActiveMQ for local/coding-test runs (no Docker needed)
spring.activemq.in-memory=true
spring.activemq.broker-url=vm://embedded-broker?broker.persistent=false
spring.activemq.packages.trust-all=true
spring.jms.template.default-destination=claim-events

# Keep Kafka available for production-style runs only when profile 'kafka' is active
# spring.kafka.bootstrap-servers=localhost:9092
