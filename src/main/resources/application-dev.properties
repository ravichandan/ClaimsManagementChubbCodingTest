# Development profile - uses embedded Kafka
spring.application.name=claimsmanagement
server.port=8080

# Datasource
spring.datasource.url=jdbc:h2:mem:claimsdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Flyway
spring.flyway.enabled=false

# Embedded ActiveMQ for local development and coding tests
spring.activemq.in-memory=true
spring.activemq.broker-url=vm://embedded-broker-dev?broker.persistent=false
spring.activemq.packages.trust-all=true
spring.jms.template.default-destination=claim-events

# Kafka is intentionally disabled here; enable it with --spring.profiles.active=kafka
# spring.kafka.bootstrap-servers=localhost:29092
# spring.kafka.consumer.auto-offset-reset=earliest
# spring.kafka.producer.acks=all
# spring.kafka.consumer.group-id=claims-management-group
